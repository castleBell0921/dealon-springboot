<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{admin/base :: layout(~{:: #stats-block}, ~{:: #main-block}, true)}">

  <div id="stats-block">
    <th:block th:replace="~{admin/stats :: statsRow('dashboard')}"></th:block>
  </div>

  <div id="main-block" class="nDecMng">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <div class="chart-container big-chart">
      <div class="chart-header" style="justify-content: space-between; display: flex;">
        <div class="chart-tabs">
          <span class="chart-tab active text-14px fw-bold" data-type="weekly" style="margin-right: 15px;">주간 접속자수</span>
          <span class="chart-tab text-14px fw-bold" data-type="monthly">월간 접속자수</span>
        </div>
        <div class="chart-filters" style="display: flex; gap: 10px;">
          <select id="filter-year" class="form-select form-select-sm" style="width: 100px;"></select>
          <select id="filter-month" class="form-select form-select-sm" style="width: 80px;"></select>
        </div>
      </div>
      <div class="chart-placeholder text-16px" style="border: none; padding: 0;">
        <canvas id="visitorChart"></canvas>
      </div>
    </div>

    <div class="bottom-charts">
      <div class="chart-container half-chart blue-bg" style="position: relative;">
        <div class="chart-title-sm text-16px fw-bold" style="text-align: center;">카테고리 비율</div>
        <div class="chart-placeholder" style="border: none; padding: 0; height: 150px;">
          <canvas id="categoryChart"></canvas>
        </div>
        <div id="category-legend" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; font-size: 12px;"></div>
      </div>

      <div class="chart-container half-chart beige-bg" style="position: relative;">
        <div class="chart-title-sm text-16px fw-bold" style="text-align: center;">상품 상태 비율</div>
        <div class="chart-placeholder" style="border: none; padding: 0; height: 150px;">
          <canvas id="stateChart"></canvas>
        </div>
        <div id="state-legend" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; font-size: 12px;"></div>
      </div>
    </div>

    <script th:src="@{/js/admin/dashboard.js}"></script>
  </div>

</th:block>
</html>
