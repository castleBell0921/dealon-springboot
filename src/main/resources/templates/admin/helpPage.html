<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{admin/base :: layout(~{:: #stats-block}, ~{:: #main-block}, true)}">

	<div id="stats-block">
		<th:block th:replace="~{admin/stats :: statsRow('productMng')}"></th:block>
	</div>

    <div id="main-block" class="nDecMng">
	    <link rel="stylesheet" th:href="@{/css/inquiryList.css}">
		<link rel="stylesheet" th:href="@{/css/productMng.css}">
		<link rel="stylesheet" th:href="@{/css/help.css}">
		<div class="home-page-container">
	        <div class="home-content-layout">
	            <main class="home-main-content">
	                <div class="inquiry-page-wrapper" style="padding: 20px 0;">
	                    <div class="inquiry-container">
	                        <header class="inquiry-header">
	                            <div class="header-top">
	                                <span class="category" th:text="${inquiry != null ? inquiry.category : '결제/환불'}">결제/환불</span>
	                                <span th:class="'status-badge ' + ${inquiry != null ? inquiry.status.toLowerCase() : 'answered'}"
	                                      th:text="${inquiry != null ? inquiry.status : '답변완료'}">답변완료</span>
	                            </div>
	                            <h1 class="title" th:text="${inquiry != null ? inquiry.title : ''}">문의 제목</h1>
	                            <p class="meta-info">문의일시: <span th:text="${inquiry != null ? #temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm') : '2024-05-20 14:00'}">2024-05-20 14:00</span></p>
	                        </header>
							
							<div class="main-image-section" th:if="${inquiry != null and inquiry.imageUrl != null}">
							    <div class="image-label">첨부된 참고 이미지</div>
							    <div class="main-image-wrapper">
							        <img th:src="${inquiry.imageUrl}" alt="문의 대표 이미지">
							    </div>
							</div>
	                        <div class="inquiry-thread">
	
								<div th:each="detail : ${inquiryDetails}"
							     th:class="'detail-item ' + ${detail.role == 'USER' ? 'user' : 'admin'}">
							
							    <!-- 관리자 -->
							    <div th:if="${detail.role == 'ADMIN'}" class="admin-profile">CS</div>
							
							    <!-- 사용자 -->
							    <div th:if="${detail.role == 'USER'}"
							         class="user-profile"
							         th:data-userno="${inquiry.userNo}"
							         th:data-username="${inquiry.nickname}"
							         th:data-email="${inquiry.email}">
						            <img th:src="${inquiry.uImageUrl != null ? inquiry.uImageUrl : '/image/default-avatar.png'}"
     									alt="profile">
							         
							        
							    </div>
							
							    <div class="bubble">
							        <p class="content"
							           th:if="${detail.content != null and #strings.length(detail.content) > 0}"
							           th:text="${detail.content}">
							        </p>
							
							        <span class="time"
							              th:text="${#temporals.format(detail.createdAt, 'HH:mm')}">
							        </span>
							    </div>
							</div>
							</div>
	
			
	                        <footer class="inquiry-footer">
	                        		<input type="hidden" id="inquiryId" th:value="${inquiry.inquiryId}">
		                            <div class="input-container">
		                                <textarea id="additionalContent" name = "addContent" placeholder="답변 내용을 입력해주세요."></textarea>
		                                <div class="button-group">
		                                    <button th:disabled="${inquiry.status == 'CLOSED'}" type="button" class="btn-submit">전송</button>
		                                </div>
		                            </div>
<!-- 	                            <button type="button" class="btn-resolve">문제가 해결됐어요</button> -->
	                        </footer>
	                    </div>
	                </div>
	            </main>
	        </div>
	    </div>
	    <div class="user-popup" id="userPopup">
		    <div class="popup-content">
		    
		        <div class="popup-header">
		            <div class="popup-profile">
		                <img th:src="${inquiry.uImageUrl != null ? inquiry.uImageUrl : '/image/default-avatar.png'}"
								alt="profile">
		            </div>
		            <div>
		                <div class="popup-name" id="popupUsername"></div>
		                <div class="popup-email" id="popupEmail"></div>
		            </div>
		        </div>
		
		        <div class="popup-body">
		            <div class="info-row">
		                <span>회원번호</span>
		                <span id="popupUserNo"></span>
		            </div>
		        </div>
		
		        <button class="popup-close" id="popupClose">닫기</button>
		
		    </div>
		</div>
	  
	    <script th:src="@{/js/admin/adminInquiry.js}"></script>
	</div>
</th:block>
</html>
