<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Deal-On 개인정보처리방침</title>

<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/App.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">
<link rel="stylesheet" th:href="@{/css/about.css}">
<link rel="stylesheet" th:href="@{/css/Home.css}">
<link rel="stylesheet" th:href="@{/css/termsPage.css}">

</head>

<body>

<div class="app-container">

<div th:replace="~{common/header :: header}"></div>

<div class="terms-page-container">

<h1 class="terms-page-title">개인정보처리방침</h1>

<section class="terms-section">

<h2>1. 수집하는 개인정보</h2>

<p>
회사는 회원가입 및 서비스 제공을 위해 다음과 같은 개인정보를 수집합니다.
</p>

<ul>
<li>이메일</li>
<li>닉네임</li>
<li>프로필 이미지</li>
<li>거래 기록</li>
</ul>

</section>


<section class="terms-section">

<h2>2. 개인정보 이용 목적</h2>

<ul>
<li>회원 식별 및 서비스 제공</li>
<li>고객 문의 대응</li>
<li>서비스 개선</li>
</ul>

</section>


<section class="terms-section">

<h2>3. 개인정보 보관 기간</h2>

<p>
회원 탈퇴 시까지 보관하며, 관계 법령에 따라 일정 기간 보관될 수 있습니다.
</p>

</section>


<section class="terms-section">

<h2>4. 이용자의 권리</h2>

<p>
이용자는 언제든지 자신의 개인정보를 조회하거나 수정할 수 있으며,
회원 탈퇴를 통해 삭제를 요청할 수 있습니다.
</p>

</section>

</div>

<div th:replace="~{common/footer :: footer}"></div>

</div>

</body>
</html>
